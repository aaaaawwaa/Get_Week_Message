<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>热点周报历史</title>
  <style>
    :root {
      --bg: #f2f7f5;
      --surface: #ffffff;
      --text: #1b2224;
      --text-secondary: #4f5b60;
      --primary: #1d6f5e;
      --primary-light: #e2f0ec;
      --accent: #1d6f5e;
      --border: #d6e4df;
      --shadow: 0 2px 12px rgba(0,0,0,0.06);
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #e9f5f2 0%, #f2f7f5 55%, #edf4f1 100%);
      color: var(--text);
      font-family: "Noto Serif SC", "PingFang SC", "Microsoft Yahei", serif;
      padding: 0;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .app-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .app-bar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: var(--primary);
    }
    .app-bar-brand svg { width: 24px; height: 24px; }
    .app-bar-nav { display: flex; gap: 6px; }
    .app-bar-nav a {
      padding: 8px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: all 0.15s;
    }
    .app-bar-nav a:hover { background: var(--primary-light); color: var(--primary); }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
    }

    .hero {
      background: linear-gradient(135deg, #1d6f5e 0%, #155a49 100%);
      border-radius: var(--radius);
      padding: 28px 32px;
      margin-bottom: 24px;
      color: #fff;
      box-shadow: 0 8px 24px rgba(29,111,94,0.2);
    }
    .hero h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hero .sub {
      font-size: 14px;
      opacity: 0.85;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Controls */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    .controls input[type="search"] {
      flex: 1 1 200px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      background: var(--surface);
    }
    .controls input[type="search"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29,111,94,0.12);
    }
    .controls .btn {
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .controls .btn:hover { background: var(--bg); color: var(--text); }
    .controls .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .controls .page-info {
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    /* Week List */
    .week-list {
      display: grid;
      gap: 10px;
    }
    .week-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
      transition: all 0.15s;
      animation: fadeIn 0.4s ease both;
    }
    .week-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .week-item:nth-child(1) { animation-delay: 0.02s; }
    .week-item:nth-child(2) { animation-delay: 0.04s; }
    .week-item:nth-child(3) { animation-delay: 0.06s; }
    .week-item:nth-child(4) { animation-delay: 0.08s; }
    .week-item:nth-child(5) { animation-delay: 0.10s; }

    .week-left { display: flex; align-items: center; gap: 14px; }
    .week-icon {
      width: 40px; height: 40px;
      background: var(--primary-light);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .week-date {
      font-size: 16px;
      font-weight: 600;
    }
    .week-date a:hover { color: var(--primary); text-decoration: underline; }
    .week-count {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .empty-state {
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px;
      text-align: center;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 720px) {
      .container { padding: 16px; }
      .app-bar { padding: 0 16px; }
      .app-bar-nav a { padding: 6px 10px; font-size: 13px; }
      .hero { padding: 20px; }
      .hero h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-brand">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      每周热点
    </div>
    <nav class="app-bar-nav">
      <a href="/reports/latest.html" id="nav-latest">最新周报</a>
      <a href="/history">历史记录</a>
      <a href="/config">仪表盘</a>
    </nav>
  </header>

  <div class="container">
    <div class="hero">
      <h1>📚 历史周报</h1>
      <div class="sub">
        <span>共 {{ weeks | length }} 期</span>
        <span>⏱ {{ generated_at }}</span>
      </div>
    </div>

    <div class="controls">
      <input id="search" type="search" placeholder="🔍 按日期搜索... (如 2026-05)" />
      <button class="btn" id="clear">清空</button>
      <button class="btn" id="prev" disabled>← 上一页</button>
      <span class="page-info" id="page-info"></span>
      <button class="btn" id="next" disabled>下一页 →</button>
    </div>

    <div class="week-list" id="week-list">
      {% if weeks %}
      {% for week in weeks %}
      <div class="week-item" data-week="{{ week.week_start }}">
        <div class="week-left">
          <div class="week-icon">📅</div>
          <div>
            <div class="week-date"><a href="{{ week.link }}">{{ week.week_start }}</a></div>
          </div>
        </div>
        <div class="week-count">{{ week.total }} 条热点</div>
      </div>
      {% endfor %}
      <div class="empty-state" id="empty-filter" style="display:none;">
        <div class="icon">🔍</div>
        <div>无匹配结果，请调整关键词。</div>
      </div>
      {% else %}
      <div class="empty-state">
        <div class="icon">📭</div>
        <div>暂无周报，请先运行抓取任务。</div>
        <div style="margin-top:12px;"><a href="/config" style="color:var(--primary);text-decoration:underline;">前往仪表盘 →</a></div>
      </div>
      {% endif %}
    </div>
  </div>

  <script>
    const searchInput = document.getElementById("search");
    const clearBtn = document.getElementById("clear");
    const prevBtn = document.getElementById("prev");
    const nextBtn = document.getElementById("next");
    const pageInfo = document.getElementById("page-info");
    const items = Array.from(document.querySelectorAll(".week-item"));
    const emptyFilter = document.getElementById("empty-filter");

    const pageSize = 12;
    let currentPage = 1;
    let filtered = items;

    function render() {
      if (emptyFilter) {
        emptyFilter.style.display = filtered.length === 0 ? "flex" : "none";
      }
      if (filtered.length === 0) {
        items.forEach(item => { item.style.display = "none"; });
        pageInfo.textContent = "无结果";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      if (currentPage > totalPages) currentPage = totalPages;

      items.forEach(item => { item.style.display = "none"; });
      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      filtered.slice(start, end).forEach(item => { item.style.display = "flex"; });

      pageInfo.textContent = `第 ${currentPage} / ${totalPages} 页`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= totalPages;
    }

    function applyFilter() {
      const query = searchInput.value.trim().toLowerCase();
      filtered = items.filter(item => item.dataset.week.toLowerCase().includes(query));
      currentPage = 1;
      render();
    }

    prevBtn.addEventListener("click", () => { currentPage--; render(); });
    nextBtn.addEventListener("click", () => { currentPage++; render(); });
    searchInput.addEventListener("input", applyFilter);
    clearBtn.addEventListener("click", () => { searchInput.value = ""; applyFilter(); });
    render();
  </script>
</body>
</html>
